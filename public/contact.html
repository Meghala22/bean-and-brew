<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bean & Brew | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Bean & Brew</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-section">

            <h2>Reserve a Table</h2>
            <p>We would love to have you at Bean & Brew!</p>
<form action="/submit-reservation" method="POST">

    <label for="name">Name:</label>
    <input
        type="text"
        id="name"
        name="name"
        required
    >

    <label for="email">Email:</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label for="phone">Phone:</label>
    <input
        type="tel"
        id="phone"
        name="phone"
        required
    >

    <label for="date">Preferred Date:</label>
    <input
        type="date"
        id="date"
        name="date"
        required
    >

    <label for="message">Message:</label>
    <textarea
        id="message"
        name="message"
        rows="5"
    ></textarea>

    <button type="submit">
        Book Table
    </button>

</form>

        </section>

    </main>

</body>

</html>
